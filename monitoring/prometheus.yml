global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: producer
    static_configs: [{ targets: ["producer:8001"] }]
  - job_name: spark-job
    static_configs: [{ targets: ["spark-job:8002"] }]
  - job_name: alert-service
    metrics_path: /metrics/
    static_configs: [{ targets: ["alert-service:8000"] }]
